<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day-4 My lists</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <h1>All Lists Example</h1>
    <h2>Ordered List</h2>
    <ol type="1" start="" 60>
        <!-- List items  -->

        <li>A for Apple</li>
        <li>B for Ball</li>
        <li>C for Cat</li>

    </ol>

    <h3>Unordered List</h3>
    <ul type="circle">
        <li>A for Apple</li>
        <li>B for Ball</li>
        <li>C for Cat</li>
    </ul>



    <h3>Description List</h3>
    <dl>
        <dt>Intro</dt>
        <dd>my name is Hunter </dd>
        <dt>College</dt>
        <dd>My college is Nigason</dd>

    </dl>


</body>

</html>
