<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 1 Assignment - Card Component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <img src="../img/bird.jpg" alt="Beautiful bird" class="card-img">
            <h2 class="card-title">Beautiful Nature</h2>
            <p class="card-desc">
                A story of a bird tagged as the funniest bird alive, and a thoughtful reminder of why we must cherish
                and protect wildlife and nature.
            </p>
            <button class="card-btn">Read More</button>
        </div>
    </div>
</body>

</html>
